spring:
  application:
    name: back
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    hikari:
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100 # 036-A 나아가기 : 목록의 댓글 수 조회시 N+1 완화
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE