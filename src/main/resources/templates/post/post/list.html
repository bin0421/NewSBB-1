<html layout:decorate="~{layout}">

<head>
    <title>글 목록</title>
</head>

<div layout:fragment="content">

    <h2>글 목록</h2>

    <!-- 045-A 나아가기 : 검색 -->
    <form method="GET" th:action="@{/posts}">
        <input type="search" name="kw" placeholder="제목, 내용, 작성자" th:value="${kw}">
        <input type="hidden" name="sort" th:value="${sort}">
        <button type="submit">검색</button>
    </form>
    <!-- 045-B 나아가기 : 정렬 -->
    <div>
        <strong th:if="${sort != 'vote'}">최신순</strong>
        <a th:unless="${sort != 'vote'}" th:href="@{/posts(kw=${kw}, sort=latest)}">최신순</a>
        |
        <strong th:if="${sort == 'vote'}">추천순</strong>
        <a th:unless="${sort == 'vote'}" th:href="@{/posts(kw=${kw}, sort=vote)}">추천순</a>
    </div>

    <div th:if="${posts.isEmpty()}">검색 결과가 없습니다.</div>

    <ul>
        <li th:each="post : ${posts}">
            <a th:href="@{/posts/{id}(id=${post.id})}" th:text="|${post.id} : ${post.title}|">글 제목</a>
            <!-- 036-A 나아가기 : 댓글 수 -->
            <span th:unless="${post.comments.isEmpty()}" style="color: red;" th:text="|[${post.comments.size()}]|">[댓글 수]</span>
            <span th:text="${post.author?.username ?: '(알 수 없음)'}">작성자</span> <!-- 042-A 나아가기 -->
            <span th:unless="${post.voters.isEmpty()}" th:text="|추천 ${post.voters.size()}|">추천 수</span> <!-- 044-A 나아가기 -->
            <span th:text="${#temporals.format(post.createDate, 'yy.MM.dd HH:mm')}">작성일</span>
        </li>
    </ul>

    <div>
        <a href="posts/write">글 쓰기</a>
    </div>

    <!-- 029-B 나아가기 : 페이징 (현재 페이지 기준 앞뒤 4페이지까지 표시) -->
    <div th:if="${posts.totalPages > 1}"
         th:with="currentPage = ${posts.number + 1},
                  startPage = ${T(java.lang.Math).max(1, currentPage - 4)},
                  endPage = ${T(java.lang.Math).min(posts.totalPages, currentPage + 4)}">
        <a th:if="${posts.hasPrevious()}" th:href="@{/posts(page=${currentPage - 1}, kw=${kw}, sort=${sort})}">이전</a>
        <th:block th:each="p : ${#numbers.sequence(startPage, endPage)}">
            <strong th:if="${p == currentPage}" th:text="${p}"></strong>
            <a th:unless="${p == currentPage}" th:href="@{/posts(page=${p}, kw=${kw}, sort=${sort})}" th:text="${p}"></a>
        </th:block>
        <a th:if="${posts.hasNext()}" th:href="@{/posts(page=${currentPage + 1}, kw=${kw}, sort=${sort})}">다음</a>
    </div>

</div>
</html>
