<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">커뮤니티 사이트 A</title>

    <meta name="_csrf" th:content="${_csrf.token}">

    <!--
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    -->

    <script src="/resource/global.js" defer></script>
</head>
<body>

<header>
    <h1>커뮤니티 사이트 A</h1>
    <nav>
        <a href="/posts">글 목록</a>
        <!-- 041-B 나아가기 : 로그인 상태에 따라 메뉴 변경 -->
        <th:block th:if="${currentUsername == null}">
            <a href="/members/login">로그인</a>
            <a href="/members/join">회원가입</a> <!-- 041-A 나아가기 -->
        </th:block>
        <th:block th:unless="${currentUsername == null}">
            <span th:text="|${currentUsername}님|"></span>
            <form method="POST" th:action="@{/members/logout}" style="display: inline;">
                <button type="submit">로그아웃</button>
            </form>
        </th:block>
    </nav>
</header>

<th:block layout:fragment="content"></th:block>

<footer>
    <div>커뮤니티 사이트 A all rights reserved.</div>
</footer>

</body>
</html>
