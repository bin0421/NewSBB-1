<html layout:decorate="~{layout}">

<head>
    <title>로그인</title>
</head>

<div layout:fragment="content">

    <h2>로그인</h2>

    <div th:if="${param.error}" style="color: red;">아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <!-- 시큐리티의 formLogin 이 POST /members/login 을 처리한다 -->
    <form method="POST" th:action="@{/members/login}">
        <div>
            <label for="username">아이디</label><br>
            <input type="text" id="username" name="username" placeholder="아이디" autofocus>
        </div>
        <div>
            <label for="password">비밀번호</label><br>
            <input type="password" id="password" name="password" placeholder="비밀번호">
        </div>
        <input type="submit" value="로그인">
    </form>

</div>
</html>
