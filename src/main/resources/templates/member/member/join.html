<html layout:decorate="~{layout}">

<head>
    <title>회원가입</title>
</head>

<div layout:fragment="content">

    <h2>회원가입</h2>

    <form method="POST" th:action th:object="${form}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>

        <div>
            <label for="username">아이디</label><br>
            <input type="text" placeholder="아이디" th:field="*{username}" autofocus>
        </div>
        <div>
            <label for="password">비밀번호</label><br>
            <input type="password" placeholder="비밀번호" th:field="*{password}">
        </div>
        <div>
            <label for="passwordConfirm">비밀번호 확인</label><br>
            <input type="password" placeholder="비밀번호 확인" th:field="*{passwordConfirm}">
        </div>
        <div>
            <label for="email">이메일</label><br>
            <input type="email" placeholder="이메일" th:field="*{email}">
        </div>
        <input type="submit" value="가입">
    </form>

</div>
</html>
